name: Build & Release (Windows)

# Builds the Windows NSIS installer on a clean Windows runner and publishes
# it as a GitHub Release (with latest.yml for electron-updater auto-updates).
#
# Trigger:
#   - manually via the Actions tab / API (workflow_dispatch)
#   - automatically when a tag like v1.0.1 is pushed
#
# The release tag/version comes from package.json "version".

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.314
          cache: true
          cache-dependency-path: native/**/packages.lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore and test capture helper
        run: |
          dotnet restore native/Kern.Recorder.sln --locked-mode
          dotnet test native/Kern.Recorder.sln --configuration Release --no-restore
          npm run test:node
          npm run build:helper

      # electron-builder uploads the installer and its .blockmap in parallel, and when no release
      # exists yet each upload creates its own: v1.1.0 ended up as two releases for one tag. Create
      # the one draft release up front. electron-builder finds a draft for the tag and uploads
      # everything to it, and nothing is public until every asset is there.
      - name: Create the draft release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          COUNT=$(printf '%s' "$IDS" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then echo "More than one release already exists for $TAG"; exit 1; fi
          if [ "$COUNT" -eq 0 ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "${TAG#v}" --notes ""
          fi

      - name: Build and upload Windows installer
        env:
          # electron-builder reads GH_TOKEN to publish the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Publish the release once every asset is attached
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ "$(printf '%s' "$ID" | grep -c .)" -ne 1 ]; then echo "Expected exactly one release for $TAG"; exit 1; fi
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[].name')
          for NAME in "Kern-Setup-$VERSION.exe" "Kern-Setup-$VERSION.exe.blockmap" "latest.yml"; do
            printf '%s\n' "$ASSETS" | grep -Fxq "$NAME" || { echo "Missing release asset: $NAME"; exit 1; }
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true
