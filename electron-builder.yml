appId: com.levityleads.kern
productName: Kern
copyright: Copyright © 2026 Levity Leads Ltd

directories:
  output: dist
  buildResources: assets

files:
  - main.js
  - preload.js
  - package.json
  - node_modules/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
  artifactName: Kern-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: assets/icon.png
  category: Utility

publish:
  provider: github
  owner: levityleads
  repo: kern-desktop
