<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
    <title>Kern</title>
    <link rel="stylesheet" href="prompt.css" />
  </head>
  <body>
    <main class="prompt" role="alertdialog" aria-labelledby="prompt-title" aria-describedby="prompt-body">
      <div class="prompt-head">
        <span class="dot" aria-hidden="true"></span>
        <span class="brand">Kern</span>
        <button id="prompt-close" class="close" type="button" aria-label="Close">&times;</button>
      </div>
      <h1 id="prompt-title">Kern</h1>
      <p id="prompt-body"></p>
      <div class="prompt-actions">
        <button id="prompt-primary" class="primary" type="button">OK</button>
        <button id="prompt-dismiss" class="ghost" type="button">Not now</button>
      </div>
    </main>
    <script src="prompt.js"></script>
  </body>
</html>
